# Regenerates the indexes, GOVERNANCE.md and changelogs on every push to main
# and fills in decision record commit hashes. It pushes with the
# workflow deploy key, so its commit triggers one more run, which finds nothing to commit.
name: build-index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Deploy key: the only actor allowed past the main-branch ruleset.
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: ci/go.mod
          cache-dependency-path: ci/go.sum
      - name: Build indexes
        run: go -C ci run . build-index --fill-commits
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A INDEX.md GOVERNANCE.md index industries shared records
            git commit -m "Regenerate indexes, governance page and changelogs"
            git push
          else
            echo "Generated files are up to date."
          fi
