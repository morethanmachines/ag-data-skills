- 'Write one GrapeLog row per application event and block from the mapped records: convert rates to per-hectare,
  water to total litres for the block area, and block names to wine company codes.'
- Report anything that cannot be carried across (for example registration numbers, which GrapeLog has
  no column for).
scoring:
- Rows match the GrapeLog export on Applied (date and time), Block, product, rate per ha (within 0.5%),
  unit and Water (L) (within 1 L).
- Row count matches.
