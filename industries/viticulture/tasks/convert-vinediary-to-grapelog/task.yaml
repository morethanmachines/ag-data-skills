task_version: 1
id: convert-vinediary-to-grapelog
industry: viticulture
fixture_set: spray-diary-01
spec: viticulture/spray-diary
question: Convert the VineDiary records into the GrapeLog layout so the wine company can load them.
inputs:
- fixtures/spray-diary-01/exports/vinediary_export_2025-26.csv
- fixtures/spray-diary-01/exports/grapelog_export_2025-26.csv
