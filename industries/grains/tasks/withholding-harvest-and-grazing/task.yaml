task_version: 1
id: withholding-harvest-and-grazing
industry: grains
fixture_set: spray-diary-02
spec: shared/spray-diary
question: Will any paddock breach a harvest withholding period at its planned harvest date, and what is
  the earliest date stock can go onto each paddock after its last spray?
inputs:
- fixtures/spray-diary-02/exports/paddockbook_spray_records_2025.csv
- fixtures/spray-diary-02/exports/sprayjob_contractor_jobs_2025.json
- fixtures/spray-diary-02/exports/spray_records_by_paddock_2025.xlsx
- fixtures/spray-diary-02/reference/paddock_register.csv
- fixtures/spray-diary-02/reference/product_register.csv
- fixtures/spray-diary-02/reference/paddocks.geojson
method:
- Map and de-duplicate the records as for product-totals-per-paddock, and attach each product's harvest
  and grazing withholding periods (days) from the product register as restrictions.
- For each paddock and product, find the last application date (local date). days_before_harvest = planned
  harvest minus last application, in whole days. A product breaches if days_before_harvest is less than
  its harvest withholding period.
- earliest_grazing_date = the latest, over every application to the paddock, of application date plus
  that product's grazing withholding period.
scoring:
- Both harvest breaches found, no false positives.
- earliest_grazing_date correct for every paddock.
